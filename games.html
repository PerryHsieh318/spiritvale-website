<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>星維實驗 SV LAB｜遊戲工具與產品平台</title>

  <meta
    name="description"
    content="星維實驗 SV LAB 提供多款遊戲工具、功能介紹、安裝教學、版本更新與中文客服支援。"
  >

  <link
    rel="canonical"
    href="https://svlab.cc/"
  >

  <link
    rel="icon"
    href="assets/images/favicon.ico"
    sizes="any"
  >

  <link
    rel="stylesheet"
    href="assets/css/style.css"
  >
</head>

<body>

  <header class="navbar">
    <div class="container navbar-content">

      <a href="games.html" class="brand">
        <img
          src="assets/images/sv-icon.png"
          alt="星維實驗 SV LAB Logo"
        >
        <span>星維實驗 SV LAB</span>
      </a>

      <nav class="main-navigation">
        <a href="#games">遊戲產品</a>
        <a href="contact.html">聯絡方式</a>
        <a href="privacy.html">隱私權政策</a>
      </nav>

    </div>
  </header>

  <main class="brand-home">

    <section class="brand-hero">

      <div class="container">

        <p class="eyebrow">
          星維實驗・SV LAB
        </p>

        <h1>
          選擇你的遊戲
        </h1>

        <p>
          星維實驗提供各項遊戲｜外掛｜腳本｜輔助｜之安裝教學、版本更新與客服支援。
        </p>

      </div>

    </section>

    <section
      id="games"
      class="game-selection"
    >

      <div class="container">

        <div class="game-grid">

          <a
            href="spiritvale/"
            class="game-card"
          >

            <img
              src="assets/images/spiritvale-cover.jpg"
              alt="SpiritVale 遊戲畫面"
            >

            <div class="game-card-overlay">

              <p class="game-status">
                熱門產品
              </p>

              <h2>SpiritVale</h2>

              <p>
                靈谷｜外掛｜腳本｜輔助 功能設定與安裝教學。
              </p>

              <span>
                進入 SpiritVale 專區 →
              </span>

            </div>

          </a>

          <a
            href="maple/"
            class="game-card"
          >

            <img
              src="assets/images/maple-cover.jpg"
              alt="楓之谷經典服遊戲畫面"
            >

            <div class="game-card-overlay">

              <p class="game-status">
                COMING SOON
              </p>

              <h2>楓之谷經典服</h2>

              <p>
                新楓之谷｜外掛｜腳本｜輔助 功能設定與安裝教學。
              </p>

              <span>
                進入楓之谷經典服專區 →
              </span>

            </div>

          </a>

        </div>

      </div>

    </section>

  </main>

</body>
</html>
